name: BloodBridge CI/CD

# test ─┬─> build + Trivy scan + push (backend, frontend) ──> GitOps: bump image tags ──> Argo CD syncs EKS
# lint ─┤
# scan ─┘
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "demo/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # ───────────────────────────── 1. Quality gates ─────────────────────────────
  backend:
    name: Backend · lint, test, migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bloodbridge
          POSTGRES_USER: bloodbridge
          POSTGRES_PASSWORD: bloodbridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bloodbridge" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint and format check (ruff)
        run: |
          ruff check . --output-format=github
          ruff format --check .

      - name: Unit + API tests (pytest, isolated SQLite test DB)
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85 --junitxml=junit.xml

      - name: Migrations against real PostgreSQL (upgrade, drift check, downgrade, upgrade)
        env:
          DATABASE_URL: postgresql+psycopg://bloodbridge:bloodbridge@localhost:5432/bloodbridge
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/junit.xml
            backend/coverage.xml

  frontend:
    name: Frontend · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  infra-lint:
    name: IaC · terraform validate + helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt / init / validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - uses: azure/setup-helm@v4
      - name: helm lint + render every environment
        run: |
          for values in values.yaml values-dev.yaml values-prod.yaml; do
            helm lint helm/bloodbridge -f helm/bloodbridge/$values
            helm template bloodbridge helm/bloodbridge -n bloodbridge -f helm/bloodbridge/$values > /dev/null
          done

  source-scan:
    name: DevSecOps · secrets, dependencies, IaC misconfig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Trivy
        run: ./scripts/install-trivy.sh
      - name: Secrets + vulnerable dependencies (blocking)
        run: trivy fs --scanners secret,vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
      - name: IaC misconfigurations — Terraform, Helm, Dockerfiles (report only)
        run: trivy config --severity HIGH,CRITICAL --exit-code 0 .

  # ──────────────────── 2. Build → scan → push container images ────────────────────
  images:
    name: Image · ${{ matrix.service }}
    needs: [backend, frontend, infra-lint, source-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Image name (GHCR requires lowercase)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/bloodbridge-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image (tag = commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Install Trivy
        run: ./scripts/install-trivy.sh

      - name: Trivy image scan — fail on HIGH/CRITICAL with a fix available
        run: |
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile .trivyignore "${IMAGE}:${GITHUB_SHA}"

      - name: Trivy full report + SBOM (CycloneDX)
        if: always()
        run: |
          trivy image --format json --output trivy-${{ matrix.service }}.json "${IMAGE}:${GITHUB_SHA}"
          trivy image --format cyclonedx --output sbom-${{ matrix.service }}.cdx.json "${IMAGE}:${GITHUB_SHA}"

      - name: Upload scan report and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-${{ matrix.service }}
          path: |
            trivy-${{ matrix.service }}.json
            sbom-${{ matrix.service }}.cdx.json

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          echo "### ${{ matrix.service }}: \`${IMAGE}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

  # ───────────────── 3. GitOps deploy: Argo CD picks up the new tag ─────────────────
  gitops:
    name: Deploy · bump image tags (Argo CD syncs)
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Write new image references into values-prod.yaml
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          FILE=helm/bloodbridge/values-prod.yaml
          yq -i "
            .backend.image.repository = \"${REGISTRY}/${OWNER}/bloodbridge-backend\" |
            .backend.image.tag = \"${GITHUB_SHA}\" |
            .frontend.image.repository = \"${REGISTRY}/${OWNER}/bloodbridge-frontend\" |
            .frontend.image.tag = \"${GITHUB_SHA}\"
          " "$FILE"
          git diff --stat

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/bloodbridge/values-prod.yaml
          if git diff --cached --quiet; then echo "Nothing to deploy"; exit 0; fi
          git commit -m "deploy: bloodbridge ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "Deployed \`${GITHUB_SHA::7}\` — Argo CD will sync within ~1 minute." >> "$GITHUB_STEP_SUMMARY"
