# Weekly PRs for outdated / vulnerable dependencies; each PR runs the full CI + Trivy gate.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly}
    groups:
      python-deps: {patterns: ["*"]}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    groups:
      npm-deps: {patterns: ["*"]}
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: terraform
    directory: /terraform
    schedule: {interval: monthly}
