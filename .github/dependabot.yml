# Weekly PRs for outdated / vulnerable dependencies; each PR runs the full CI + Trivy gate.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: {interval: weekly}
    groups:
      python-deps: {patterns: ["*"]}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    groups:
      npm-deps: {patterns: ["*"]}
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: terraform
    directory: /terraform
    schedule: {interval: monthly}
    # Major module versions (e.g. EKS v21) rename inputs; upgrade those deliberately, not via a bot PR.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
