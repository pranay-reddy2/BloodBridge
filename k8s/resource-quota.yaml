# Guard rails for the namespace: caps total resources so a runaway HPA or a bad
# manifest cannot starve the rest of the cluster.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bloodbridge-quota
  namespace: bloodbridge
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 10Gi
    persistentvolumeclaims: "4"
    pods: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: bloodbridge-defaults
  namespace: bloodbridge
spec:
  limits:
    - type: Container
      default: {cpu: 200m, memory: 256Mi}
      defaultRequest: {cpu: 50m, memory: 64Mi}
