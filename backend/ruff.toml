line-length = 130
target-version = "py313"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
# S101: asserts are how pytest works. B008: FastAPI's Depends()/Query() defaults are idiomatic.
ignore = ["B008"]

[lint.per-file-ignores]
"tests/*" = ["S101"]
"alembic/*" = ["E501"]

[lint.isort]
# the local alembic/ migrations folder would otherwise shadow the alembic package
known-third-party = ["alembic"]
known-first-party = ["app"]
