# SCENARIO 1 — the CI pipeline "deployed" a tag that was never pushed.
# Symptom: pod stuck in ErrImagePull / ImagePullBackOff.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-bad-image
  namespace: bloodbridge
  labels: {lab: troubleshooting}
spec:
  replicas: 1
  selector: {matchLabels: {app: lab-bad-image}}
  template:
    metadata: {labels: {app: lab-bad-image, lab: troubleshooting}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:this-tag-does-not-exist
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
