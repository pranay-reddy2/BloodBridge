# SCENARIO 2 — a Service whose selector matches no pod (typo in a label).
# Symptom: pods are Running, but the Service has no endpoints and requests time out / 503.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-echo
  namespace: bloodbridge
  labels: {lab: troubleshooting}
spec:
  replicas: 1
  selector: {matchLabels: {app: lab-echo}}
  template:
    metadata: {labels: {app: lab-echo, lab: troubleshooting}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 101, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:stable-alpine
          ports: [{containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: lab-echo
  namespace: bloodbridge
  labels: {lab: troubleshooting}
spec:
  selector: {app: lab-ecoh}        # <-- bug: should be lab-echo
  ports: [{port: 80, targetPort: 8080}]
