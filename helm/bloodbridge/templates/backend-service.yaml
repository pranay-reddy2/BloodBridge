apiVersion: v1
kind: Service
metadata:
  name: {{ include "bloodbridge.fullname" . }}-backend
  labels: {{- include "bloodbridge.labels" (dict "ctx" . "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "bloodbridge.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
