{{- if .Values.monitoring.grafanaDashboard.enabled }}
# Picked up automatically by the Grafana sidecar shipped with kube-prometheus-stack.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bloodbridge.fullname" . }}-dashboard
  labels:
    {{- include "bloodbridge.labels" (dict "ctx" . "component" "monitoring") | nindent 4 }}
    grafana_dashboard: "1"
data:
  bloodbridge.json: |-
{{ .Files.Get "dashboards/bloodbridge.json" | indent 4 }}
{{- end }}
