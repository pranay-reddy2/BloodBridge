{{- if .Values.postgres.enabled }}
{{- $c := dict "ctx" . "component" "database" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bloodbridge.fullname" . }}-postgres
  labels: {{- include "bloodbridge.labels" $c | nindent 4 }}
spec:
  type: ClusterIP
  selector: {{- include "bloodbridge.selectorLabels" $c | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "bloodbridge.fullname" . }}-postgres
  labels: {{- include "bloodbridge.labels" $c | nindent 4 }}
spec:
  serviceName: {{ include "bloodbridge.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "bloodbridge.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "bloodbridge.labels" $c | nindent 8 }}
    spec:
      securityContext:
        # UID/GID 70 is the `postgres` user in the Alpine image; fsGroup lets it own the volume.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_DB, value: {{ .Values.postgres.database | quote }}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ include "bloodbridge.dbSecret" . }}, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "bloodbridge.dbSecret" . }}, key: password}}
            # A sub-directory, because the volume root (with lost+found on EBS) is not empty.
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}
