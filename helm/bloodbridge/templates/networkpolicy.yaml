{{- if and .Values.networkPolicy.enabled .Values.postgres.enabled }}
# PostgreSQL accepts connections from BloodBridge backend pods only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bloodbridge.fullname" . }}-postgres
  labels: {{- include "bloodbridge.labels" (dict "ctx" . "component" "database") | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "bloodbridge.selectorLabels" (dict "ctx" . "component" "database") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "bloodbridge.selectorLabels" (dict "ctx" . "component" "backend") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 5432}
{{- end }}
