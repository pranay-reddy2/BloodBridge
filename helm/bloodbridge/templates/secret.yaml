{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bloodbridge.dbSecret" . }}
  labels: {{- include "bloodbridge.labels" (dict "ctx" . "component" "database") | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.username | quote }}
  password: {{ required "postgres.password is required when postgres.existingSecret is empty" .Values.postgres.password | quote }}
{{- end }}
